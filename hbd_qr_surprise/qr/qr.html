<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tạo mã QR cho món quà</title>
  <style>
    body{font-family: Arial, sans-serif; margin: 2rem; line-height:1.6}
    input, button{font-size:1rem; padding:.6rem .8rem; border-radius:8px; border:1px solid #ccc}
    #qr{margin-top:1rem}
  </style>
</head>
<body>
  <h1>🔗 Tạo mã QR</h1>
  <p>Nhập URL trang quà sinh nhật (sau khi bạn đã up lên GitHub Pages/Netlify):</p>
  <input id="url" placeholder="https://yourname.github.io/hbd/" size="40">
  <button id="make">Tạo QR</button>
  <div id="qr"></div>
  <script src="./qrcode.min.js"></script>
  <script>
    const btn = document.getElementById('make');
    const out = document.getElementById('qr');
    btn.onclick = () => {
      const url = document.getElementById('url').value.trim();
      if(!url) return alert('Nhập URL trước đã nhé!');
      out.innerHTML = '';
      const q = new QRCode(out);
      q.makeCode(url);
    };
  </script>
</body>
</html>
