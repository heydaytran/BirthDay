<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday 🎂💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#0f1020; --bg2:#1a0f2e; --pink:#ff3b7f; --gold:#ffd166; --white:#fff;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; overflow:hidden; color:var(--white);
      font-family:"Poppins",system-ui,Arial;
      background: radial-gradient(1000px 500px at 70% 20%, rgba(255,255,255,.08), transparent 60%),
                  radial-gradient(800px 500px at 20% 80%, rgba(255,59,127,.08), transparent 60%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
    }
    header{
      position:fixed; inset:16px 16px auto 16px; text-align:center; z-index:2;
    }
    h1{
      margin:0; font-family:"Great Vibes", cursive;
      font-size: clamp(34px, 6vw, 72px);
      text-shadow:0 10px 30px rgba(255,59,127,.3);
    }
    .subtitle{ margin:.25rem 0 0; opacity:.9 }
    .footer{ position:fixed; inset:auto 0 10px 0; text-align:center; opacity:.75; font-size:12px }
    .controls{
      position:fixed; right:16px; bottom:16px; display:flex; gap:8px; z-index:3;
    }
    .btn{
      padding:10px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.2);
      background:linear-gradient(90deg, var(--pink), #ff9cc6); color:#1d1022; font-weight:800; cursor:pointer;
      box-shadow:0 10px 24px rgba(255,59,127,.35);
    }
    canvas{ position:fixed; inset:0; width:100%; height:100%; display:block }
    .hint{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; opacity:.9; z-index:2}
    .hint .tap{ font-weight:800; letter-spacing:.2px; opacity:.9 }
  </style>
</head>
<body>
  <!-- ====== Personalize here ====== -->
  <header>
    <h1>Chúc mừng sinh nhật, <span id="friendName">Trần Văn Thịnh</span>! 🎉</h1>
    <p class="subtitle" id="message">Chúc bạn luôn khoẻ mạnh, hạnh phúc và rực rỡ như pháo hoa! ✨</p>
  </header>

  <div class="hint" id="hint">
    <div>🎁 Mở quà sinh nhật</div>
    <div class="tap">Chạm hoặc bấm để bắt đầu</div>
  </div>

  <canvas id="scene" aria-label="Sinh nhật bất ngờ"></canvas>

  <div class="controls">
    <button class="btn" id="confettiBtn">🎊 Confetti</button>
    <button class="btn" id="photoBtn">🖼️ Hiện ảnh</button>
  </div>

  <div class="footer">Made with 💗 — dành tặng <span id="footerName">Trần Văn Thịnh</span></div>

  <script>
  // ============== CONFIG ==============
  const FRIEND_NAME = "Trần Văn Thịnh";
  const MESSAGE = "Chúc bạn luôn khoẻ mạnh, hạnh phúc và rực rỡ như pháo hoa! ✨";
  const IMAGE_SRC = "./assets/friend.jpg"; // Thay ảnh này bằng ảnh của bạn ấy
  // ====================================

  // Apply text
  friendName.textContent = FRIEND_NAME;
  footerName.textContent = FRIEND_NAME;
  message.textContent = MESSAGE;

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.width = Math.floor(innerWidth * DPR);
    H = canvas.height = Math.floor(innerHeight * DPR);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  window.addEventListener('resize', resize); resize();

  // Heart confetti
  const hearts = [];
  function spawnHearts(count=150){
    for(let i=0;i<count;i++){
      hearts.push({
        x: Math.random()*W, y: -20*Math.random(),
        s: 6 + Math.random()*10,
        v: 0.5 + Math.random()*1.5,
        r: Math.random()*Math.PI, vr:(Math.random()-.5)*0.05,
        hue: Math.floor(Math.random()*360)
      });
    }
  }
  function drawHeart(x,y,s,rot,hue){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.scale(s,s);
    const g = ctx.createLinearGradient(-1,-1,1,1);
    g.addColorStop(0, `hsl(${hue},90%,70%)`);
    g.addColorStop(1, `hsl(${(hue+40)%360},90%,60%)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    // parametric heart shape
    for(let a=0;a<=Math.PI*2;a+=0.05){
      const xx = 16*Math.pow(Math.sin(a),3);
      const yy = 13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);
      ctx.lineTo(xx/20, -yy/20);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Photo particle reveal
  const img = new Image();
  img.src = IMAGE_SRC;
  let pixels = [];
  let reveal = 0;
  img.onload = () => {
    // Draw image to an offscreen canvas to sample pixels
    const off = document.createElement('canvas');
    const scale = Math.min(W*0.6/img.width, H*0.6/img.height);
    off.width = img.width*scale; off.height = img.height*scale;
    const oc = off.getContext('2d');
    oc.drawImage(img,0,0,off.width,off.height);
    const data = oc.getImageData(0,0,off.width,off.height).data;
    pixels = [];
    for(let y=0;y<off.height;y+=4){
      for(let x=0;x<off.width;x+=4){
        const i = (y*off.width + x)*4;
        const a = data[i+3];
        if(a>10){ // only opaque pixels
          const cx = (W - off.width)/2 + x;
          const cy = (H - off.height)/2 + y;
          pixels.push({x:cx, y:cy, ox: Math.random()*W, oy: Math.random()*H, life: Math.random()*60});
        }
      }
    }
  };

  let started = false;
  function startShow(){
    if(started) return;
    started = true;
    document.getElementById('hint').style.display = 'none';
    spawnHearts(200);
    // gentle reveal
    const timer = setInterval(()=>{
      reveal += 0.04;
      if(reveal>=1){ clearInterval(timer); reveal = 1; }
    }, 60);
  }
  addEventListener('click', startShow);
  addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') startShow(); });

  // Buttons
  confettiBtn.addEventListener('click', ()=> spawnHearts(200));
  photoBtn.addEventListener('click', ()=> { reveal = 0; started = false; document.getElementById('hint').style.display = 'block'; });

  // Animation loop
  function tick(){
    ctx.clearRect(0,0,W,H);

    // floating backdrop sparkles
    const grad = ctx.createRadialGradient(W*0.7, H*0.2, 0, W*0.7, H*0.2, Math.max(W,H)*0.8);
    grad.addColorStop(0, 'rgba(255,255,255,0.04)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // hearts
    for(let i=hearts.length-1;i>=0;i--){
      const h = hearts[i];
      h.y += h.v*3; h.r += h.vr;
      if(h.y > H + 40) hearts.splice(i,1);
      else drawHeart(h.x,h.y,h.s,h.r,h.hue);
    }

    // photo pixels
    if(pixels.length){
      const t = performance.now()*0.001;
      for(const p of pixels){
        const k = reveal;
        const x = p.ox*(1-k) + p.x*k;
        const y = p.oy*(1-k) + p.y*k;
        const wob = Math.sin(t + (p.x+p.y)*0.01)*2*(1-k);
        ctx.fillStyle = `rgba(255,255,255,${0.9})`;
        ctx.fillRect(x, y + wob, 2, 2);
      }
      // soft vignette
      const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.1,W/2,H/2,Math.max(W,H)*0.7);
      vg.addColorStop(0,'rgba(255,255,255,0)');
      vg.addColorStop(1,'rgba(0,0,0,0.35)');
      ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
    }

    requestAnimationFrame(tick);
  }
  tick();
  </script>
</body>
</html>
